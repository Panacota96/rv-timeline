name: Source versions

# Fails when the latest release of a source tool would be excluded as unsupported_version (QA 2026-11-19, D3:
# rv-hashinv 0.5 shipped while the reader table only listed 0.4). Daily, on demand, and on changes to the readers.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "src/core/src/readers/**"
      - "src/core/tests/source_versions.rs"
      - ".github/workflows/source-versions.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  latest-releases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain pinned in rust-toolchain.toml (channel and components)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Latest release of each source tool (public repositories)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for t in rv-hashinv rv-pdfauth rv-imgauth rv-rsmf rv-mailauth rv-certcheck rv-avauth; do
            echo "$t $(gh release view -R "Panacota96/$t" --json tagName --jq .tagName)"
          done | tee releases.txt
          {
            echo "RV_SOURCE_RELEASES<<EOF"
            cat releases.txt
            echo "EOF"
          } >> "$GITHUB_ENV"
      - name: Every latest release is read by a built-in reader
        run: |
          set -o pipefail
          cargo test --locked -p rv-timeline-core --test source_versions -- --ignored --nocapture 2>&1 | tee sv.log
          { echo '```'; grep -E "^ok |unsupported|no reader|without a release" sv.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
