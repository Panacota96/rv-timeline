name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain pinned in rust-toolchain.toml (channel and components)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: Dependency advisories, licences and sources (cargo-deny; no GPL/AGPL/LGPL; see deny.toml)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain pinned in rust-toolchain.toml (channel and components)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Clippy on Windows (the lint job runs on Linux and never compiles #[cfg(windows)] code)
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python helpers (independent verifiers + local test TSA/PKI for the trust tests)
        run: pip install blake3 jsonschema pyhanko
      - name: Unit and integration tests (includes docs/usage-cli.md drift check and trust tests)
        shell: bash
        env:
          RV_TEST_PYTHON: python
        run: |
          set -o pipefail
          # Failures are also surfaced as annotations (readable through the API without downloading logs).
          if ! cargo test --workspace --locked 2>&1 | tee test.log; then
            grep -E "panicked at|^---- |FAILED|^failures:|assertion|Error:|error:" test.log | head -40 | while IFS= read -r l; do echo "::error title=cargo test::${l}"; done
            exit 1
          fi
      - name: Ground truth (sample case against examples/sample/expected_timeline.json)
        run: cargo test --locked -p rv-timeline-core --test sample_case
      - name: Determinism (two builds of the same case give the same timeline.jsonl and reports JSON)
        run: cargo test --locked -p rv-timeline-core --test determinism
      - name: Self-test of the hash implementations
        run: cargo run --locked -q -p rv-timeline-cli -- self-test
      - name: Sample run (build on a copy of the sample case; exit 3 expected, planted signals)
        shell: bash
        run: |
          rm -rf ci-out && mkdir -p ci-out && cp -R examples/sample/case ci-out/case
          code=0
          cargo run --locked -q -p rv-timeline-cli -- build --case-dir ci-out/case --hash sha256,blake3 --lang all --progress none --no-timestamp || code=$?
          test "$code" -eq 3
      - name: Cross-language verification (Python re-checks the chain and JSON schemas)
        shell: bash
        run: |
          run=$(find ci-out/case/runs/rv-timeline -mindepth 1 -maxdepth 1 -type d -printf '%f
' | sort | tail -n 1)
          test -s "ci-out/case/runs/rv-timeline/$run/reports/timeline.jsonl"
          python tests/verify_chain.py "ci-out/case/runs/rv-timeline/$run/logs"
          python tests/validate_reports.py "ci-out/case/runs/rv-timeline/$run/reports"
      - name: Sample script (build on the sample case; timeline.jsonl written and listed in the audit log)
        if: runner.os == 'Linux'
        env:
          RV_NO_TIMESTAMP: "1"
          RV_SAMPLE_OUT: sample-out
        run: |
          cargo build --locked -q -p rv-timeline-cli
          sh examples/sample/run.sh target/debug/rv-timeline
      - name: Sample script (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RV_NO_TIMESTAMP: "1"
          RV_SAMPLE_OUT: sample-out-win
        run: |
          cargo build --locked -q -p rv-timeline-cli
          ./examples/sample/run.ps1 -Bin target/debug/rv-timeline.exe
      - name: Cross-profile golden case (written by the Python profile; tests/golden/regenerate.py)
        shell: bash
        run: |
          for z in tests/golden/case-by-*.zip.b64; do
            rm -rf golden-out && python tests/golden/unpack.py "$z" golden-out
            cargo run --locked -q -p rv-timeline-cli -- verify-case golden-out/CASE-GOLDEN
            for logs in golden-out/CASE-GOLDEN/runs/*/*/logs; do
              cargo run --locked -q -p rv-timeline-cli -- verify-log "$logs"
            done
          done
      - name: Real TSA smoke test (DigiCert; network-dependent, informative)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          rm -rf tsa-out && mkdir -p tsa-out && cp -R examples/sample/case tsa-out/case
          cargo run --locked -q -p rv-timeline-cli -- build --case-dir tsa-out/case --progress none | tee tsa.txt || true
          grep -q "timestamp: ok" tsa.txt
          run=$(find tsa-out/case/runs/rv-timeline -mindepth 1 -maxdepth 1 -type d -printf '%f
' | sort | tail -n 1)
          cargo run --locked -q -p rv-timeline-cli -- verify-log "tsa-out/case/runs/rv-timeline/$run/logs"
      - name: Build release binaries (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --locked -p rv-timeline-cli -p rv-timeline-gui
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: rv-timeline-windows-x64-${{ github.sha }}
          path: |
            target/release/rv-timeline.exe
            target/release/rv-timeline-gui.exe
          retention-days: 14

  # Size and hostile inputs, in an optimised build that keeps overflow checks and debug assertions (Linux only:
  # the code paths are platform-independent and the Windows job already runs the debug fuzz pass).
  large:
    needs: lint
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
      CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain pinned in rust-toolchain.toml (channel and components)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Large case (200k events, external sort, bounded memory, ordered timeline.jsonl)
        shell: bash
        run: |
          set -o pipefail
          cargo test --release --locked -p rv-timeline-core --test large_case -- --ignored --nocapture 2>&1 | tee large.log
          grep "large case:" large.log >> "$GITHUB_STEP_SUMMARY"
      - name: Hostile inputs (3000 mutations of the sample case, re-sealed)
        shell: bash
        env:
          RV_FUZZ_ITERS: "3000"
        run: |
          set -o pipefail
          cargo test --release --locked -p rv-timeline-core --test hostile -- --nocapture 2>&1 | tee fuzz.log
          grep "mutations, slowest" fuzz.log >> "$GITHUB_STEP_SUMMARY"
